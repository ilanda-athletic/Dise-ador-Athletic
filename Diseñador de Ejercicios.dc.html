<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #07080a; font-family: 'Archivo', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  a { color: #ff4d63; }
  a:hover { color: #ff8090; }
  input, select, button { font-family: inherit; }
  select { appearance: none; }
</style>
</helmet>

<div style="display:flex; height:100vh; width:100%; background:#07080a; color:#f5f7fa; overflow:hidden; userSelect:none">

  <aside style="width:296px; flexShrink:0; background:#eef1f6; borderRight:1px solid #d4dae4; padding:22px 20px 40px; overflowY:auto; display:flex; flexDirection:column; gap:22px">

    <div style="display:flex; flexDirection:column; gap:10px">
      <div style="fontSize:10px; fontWeight:800; letterSpacing:0.18em; color:#8b95a6">ACCIONES</div>
      <button onClick="{{ clearAll }}" style="display:flex; alignItems:center; justifyContent:center; gap:8px; padding:13px; borderRadius:12px; border:1px solid #23262d; background:#14171c; color:#ff4d63; fontSize:11px; fontWeight:800; letterSpacing:0.14em; cursor:pointer" style-hover="background:#1c2027">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>
        LIMPIAR
      </button>
      <button onClick="{{ undo }}" style="display:flex; alignItems:center; justifyContent:center; gap:8px; padding:13px; borderRadius:12px; border:1px solid #23262d; background:#14171c; color:#9aa4b2; fontSize:11px; fontWeight:800; letterSpacing:0.14em; cursor:pointer" style-hover="background:#1c2027; color:#fff">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M3 8h11a5 5 0 0 1 0 10H8M3 8l4-4M3 8l4 4"></path></svg>
        DESHACER
      </button>
    </div>

    <div style="display:flex; flexDirection:column; gap:10px">
      <div style="display:flex; alignItems:center; justifyContent:space-between">
        <div style="fontSize:10px; fontWeight:800; letterSpacing:0.18em; color:#8b95a6">ESTRUCTURA</div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b95a6" strokeWidth="2.6" strokeLinecap="round"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
      <sc-for list="{{ pitches }}" as="p" hint-placeholder-count="4">
        <button onClick="{{ p.pick }}" style="{{ p.style }}">
          <span style="display:flex; width:16px; justifyContent:center">{{ p.icon }}</span>
          {{ p.label }}
        </button>
      </sc-for>
    </div>

    <div style="display:flex; flexDirection:column; gap:10px">
      <div style="fontSize:10px; fontWeight:800; letterSpacing:0.18em; color:#8b95a6">EQUIPACIÓN</div>
      <div style="display:grid; gridTemplateColumns:repeat(2, 1fr); gap:9px">
        <sc-for list="{{ themes }}" as="t" hint-placeholder-count="2">
          <button onClick="{{ t.pick }}" style="{{ t.style }}">
            <span style="{{ t.swatch }}"></span>
            {{ t.label }}
          </button>
        </sc-for>
      </div>
    </div>

    <div style="height:1px; background:#d4dae4"></div>

    <div style="display:flex; flexDirection:column; gap:14px">
      <div style="display:flex; alignItems:center; justifyContent:space-between; gap:10px">
        <div style="fontSize:11px; fontWeight:800; letterSpacing:0.16em; color:#ff2d4d">JUGADORES</div>
        <button onClick="{{ toggleDorsales }}" style="{{ dorsalStyle }}">{{ dorsalLabel }}</button>
      </div>
      <div style="display:grid; gridTemplateColumns:repeat(6, 1fr); gap:9px">
        <sc-for list="{{ players }}" as="pl" hint-placeholder-count="11">
          <button onClick="{{ pl.pick }}" title="{{ pl.title }}" style="{{ pl.style }}">{{ pl.num }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display:flex; flexDirection:column; gap:12px">
      <div style="fontSize:10px; fontWeight:800; letterSpacing:0.18em; color:#8b95a6">CONOS</div>
      <div style="display:grid; gridTemplateColumns:repeat(4, 1fr); gap:9px">
        <sc-for list="{{ cones }}" as="c" hint-placeholder-count="4">
          <button onClick="{{ c.pick }}" title="{{ c.title }}" style="{{ c.style }}">
            <sc-if value="{{ c.isFlat }}" hint-placeholder-val="{{ false }}">
              <span style="width:20px; height:5px; borderRadius:2px; background:{{ c.color }}"></span>
            </sc-if>
            <sc-if value="{{ c.isCone }}" hint-placeholder-val="{{ true }}">
              <span style="width:0; height:0; borderLeft:9px solid transparent; borderRight:9px solid transparent; borderBottom:16px solid {{ c.color }}"></span>
            </sc-if>
            <span style="width:20px; height:3px; borderRadius:2px; background:#4b5563; marginTop:4px"></span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display:flex; flexDirection:column; gap:12px">
      <div style="fontSize:10px; fontWeight:800; letterSpacing:0.18em; color:#8b95a6">MATERIAL</div>
      <div style="display:grid; gridTemplateColumns:repeat(2, 1fr); gap:9px">
        <sc-for list="{{ material }}" as="m" hint-placeholder-count="6">
          <button onClick="{{ m.pick }}" style="{{ m.style }}">
            {{ m.icon }}
            <span style="fontSize:9px; fontWeight:800; letterSpacing:0.12em">{{ m.label }}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display:flex; flexDirection:column; gap:12px">
      <div style="fontSize:10px; fontWeight:800; letterSpacing:0.18em; color:#8b95a6">TRAZADOS</div>
      <div style="display:flex; flexDirection:column; gap:9px">
        <sc-for list="{{ strokes }}" as="s" hint-placeholder-count="3">
          <button onClick="{{ s.pick }}" style="{{ s.style }}">
            <svg width="46" height="12" viewBox="0 0 46 12" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <path d="{{ s.preview }}" strokeDasharray="{{ s.dash }}"></path>
              <path d="M38 2l6 4-6 4"></path>
            </svg>
            {{ s.label }}
          </button>
        </sc-for>
      </div>
    </div>
  </aside>

  <main style="flex:1; minWidth:0; display:flex; flexDirection:column; background:#07080a">

    <header style="display:flex; alignItems:center; gap:16px; padding:18px 26px; background:#0b0d10; borderBottom:1px solid #1b1f26">
      <div style="width:44px; height:44px; borderRadius:12px; background:#ff2d4d; display:flex; alignItems:center; justifyContent:center; flexShrink:0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b0d10" strokeWidth="2.4"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M3 12h18M12 3v18"></path></svg>
      </div>
      <div style="display:flex; flexDirection:column; gap:3px; minWidth:0">
        <div style="fontSize:9px; fontWeight:800; letterSpacing:0.28em; color:#6b7482">DEMO · DISEÑO TÁCTICO</div>
        <input value="{{ title }}" onChange="{{ setTitle }}" spellcheck="false" style="background:#14171c; border:1px solid #23262d; borderRadius:6px; padding:6px 12px; color:#fff; fontSize:26px; fontWeight:900; letterSpacing:-0.01em; textTransform:uppercase; width:520px; maxWidth:100%; outline:none" />
      </div>
      <div style="marginLeft:auto; display:flex; alignItems:center; gap:10px">
        <div style="fontSize:10px; fontWeight:800; letterSpacing:0.14em; color:#6b7482">{{ counterLabel }}</div>
        <button onClick="{{ exportPng }}" style="padding:11px 18px; borderRadius:10px; border:1px solid #23262d; background:#14171c; color:#e7ebf1; fontSize:11px; fontWeight:800; letterSpacing:0.14em; cursor:pointer" style-hover="background:#1c2027">GUARDAR</button>
      </div>
    </header>

    <div style="display:flex; alignItems:center; gap:9px; padding:14px 26px; background:#0b0d10; borderBottom:1px solid #1b1f26">
      <button onClick="{{ togglePlay }}" title="Reproducir animación" style="{{ playStyle }}">
        <sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#062b17"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
        </sc-if>
        <sc-if value="{{ notPlaying }}" hint-placeholder-val="{{ true }}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#062b17"><path d="M8 5l11 7-11 7z"></path></svg>
        </sc-if>
      </button>
      <button onClick="{{ addFrame }}" title="Añadir fase" style="width:42px; height:42px; borderRadius:10px; border:none; background:#2563eb; color:#fff; display:flex; alignItems:center; justifyContent:center; cursor:pointer" style-hover="background:#1d4ed8">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <select value="{{ speed }}" onChange="{{ setSpeed }}" style="height:42px; padding:0 16px; borderRadius:10px; border:1px solid #23262d; background:#14171c; color:#e7ebf1; fontSize:14px; fontWeight:600; minWidth:190px; cursor:pointer">
        <option value="1600">Lento</option>
        <option value="1000">Normal</option>
        <option value="600">Rápido</option>
      </select>
      <div style="display:flex; alignItems:center; gap:7px">
        <sc-for list="{{ frames }}" as="f" hint-placeholder-count="1">
          <button onClick="{{ f.pick }}" title="{{ f.title }}" style="{{ f.style }}">{{ f.n }}</button>
        </sc-for>
      </div>
      <button onClick="{{ delFrame }}" title="Eliminar fase actual" style="width:42px; height:42px; borderRadius:10px; border:1px solid #23262d; background:#14171c; color:#9aa4b2; display:flex; alignItems:center; justifyContent:center; cursor:pointer" style-hover="background:#1c2027; color:#ff4d63">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>
      </button>
      <div style="marginLeft:auto; fontSize:11px; fontWeight:700; letterSpacing:0.06em; color:#6b7482">{{ hint }}</div>
    </div>

    <div style="flex:1; minHeight:0; margin:22px 26px 26px; containerType:size; display:flex; alignItems:center; justifyContent:center; overflow:hidden">
      <div ref="{{ fieldRef }}" onPointerDown="{{ onDown }}" onContextMenu="{{ noMenu }}" style="{{ fieldStyle }}">

        <sc-if value="{{ showLines }}" hint-placeholder-val="{{ true }}">
          <svg viewBox="{{ pitchBox }}" style="position:absolute; inset:0; width:100%; height:100%; pointerEvents:none" fill="none" stroke="{{ lineColor }}" strokeWidth="4">
            <g transform="{{ pitchTransform }}">
              <path d="{{ pitchLines }}"></path>
              <circle cx="{{ spot1x }}" cy="{{ spot1y }}" r="6" fill="{{ lineColor }}" stroke="none"></circle>
              <circle cx="{{ spot2x }}" cy="{{ spot2y }}" r="6" fill="{{ lineColor }}" stroke="none"></circle>
            </g>
          </svg>
        </sc-if>

        <svg viewBox="0 0 1000 1000" preserveAspectRatio="none" style="position:absolute; inset:0; width:100%; height:100%; pointerEvents:none; overflow:visible">
          <defs>
            <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
              <path d="M0,1 L9,5 L0,9 z" fill="#fff"></path>
            </marker>
          </defs>
          <sc-for list="{{ arrows }}" as="a" hint-placeholder-count="0">
            <path d="{{ a.d }}" stroke="{{ a.color }}" strokeWidth="3.5" strokeDasharray="{{ a.dash }}" strokeLinecap="round" markerEnd="url(#ar)" vectorEffect="non-scaling-stroke" fill="none"></path>
          </sc-for>
          <sc-if value="{{ hasDraft }}" hint-placeholder-val="{{ false }}">
            <path d="{{ draftD }}" stroke="rgba(255,255,255,0.65)" strokeWidth="3.5" strokeDasharray="6 8" strokeLinecap="round" vectorEffect="non-scaling-stroke" fill="none"></path>
          </sc-if>
        </svg>

        <sc-for list="{{ items }}" as="it" hint-placeholder-count="0">
          <div onPointerDown="{{ it.grab }}" onDoubleClick="{{ it.remove }}" title="{{ it.title }}" style="{{ it.box }}">
            <sc-if value="{{ it.isPlayer }}" hint-placeholder-val="{{ false }}">
              <span style="{{ it.chip }}">{{ it.label }}</span>
            </sc-if>
            <sc-if value="{{ it.isCone }}" hint-placeholder-val="{{ false }}">
              <span style="{{ it.tri }}"></span>
            </sc-if>
            <sc-if value="{{ it.isFlat }}" hint-placeholder-val="{{ false }}">
              <span style="{{ it.flat }}"></span>
            </sc-if>
            <sc-if value="{{ it.isBall }}" hint-placeholder-val="{{ false }}">
              <span style="width:100%; height:100%; borderRadius:50%; background:radial-gradient(circle at 35% 30%, #fff 55%, #cfd6e0 100%); border:0.18cqw solid #0d1117; boxShadow:0 0.2cqw 0.5cqw rgba(0,0,0,0.45)"></span>
            </sc-if>
            <sc-if value="{{ it.isLadder }}" hint-placeholder-val="{{ false }}">
              <span style="width:100%; height:100%; border:0.22cqw solid #e5e7eb; borderRadius:0.3cqw; background:repeating-linear-gradient(90deg, transparent 0 1.1cqw, #e5e7eb 1.1cqw 1.32cqw)"></span>
            </sc-if>
            <sc-if value="{{ it.isHurdle }}" hint-placeholder-val="{{ false }}">
              <span style="width:100%; height:100%; borderTop:0.5cqw solid #ff4d63; borderLeft:0.35cqw solid #ff4d63; borderRight:0.35cqw solid #ff4d63; borderRadius:0.3cqw 0.3cqw 0 0"></span>
            </sc-if>
            <sc-if value="{{ it.isGoal }}" hint-placeholder-val="{{ false }}">
              <span style="width:100%; height:100%; borderTop:0.4cqw solid #fff; borderLeft:0.4cqw solid #fff; borderRight:0.4cqw solid #fff; background:repeating-linear-gradient(90deg, rgba(255,255,255,0.5) 0 0.12cqw, transparent 0.12cqw 0.9cqw), repeating-linear-gradient(0deg, rgba(255,255,255,0.5) 0 0.12cqw, transparent 0.12cqw 0.9cqw)"></span>
            </sc-if>
            <sc-if value="{{ it.isZone }}" hint-placeholder-val="{{ false }}">
              <span style="width:100%; height:100%; border:0.3cqw dashed rgba(255,77,99,0.9); background:rgba(255,77,99,0.16); borderRadius:0.4cqw"></span>
            </sc-if>
            <sc-if value="{{ it.isPole }}" hint-placeholder-val="{{ false }}">
              <span style="width:100%; height:100%; background:linear-gradient(180deg,#facc15,#eab308); borderRadius:0.6cqw; boxShadow:0 0.2cqw 0.5cqw rgba(0,0,0,0.4)"></span>
            </sc-if>
            <sc-if value="{{ it.isSel }}" hint-placeholder-val="{{ false }}">
              <div onPointerDown="{{ it.startResize }}" title="Arrastra para redimensionar" style="{{ it.hTL }}"></div>
              <div onPointerDown="{{ it.startResize }}" title="Arrastra para redimensionar" style="{{ it.hTR }}"></div>
              <div onPointerDown="{{ it.startResize }}" title="Arrastra para redimensionar" style="{{ it.hBL }}"></div>
              <div onPointerDown="{{ it.startResize }}" title="Arrastra para redimensionar" style="{{ it.hBR }}"></div>
              <div onPointerDown="{{ it.resizeY }}" title="Arrastra para cambiar la altura" style="{{ it.hT }}"></div>
              <div onPointerDown="{{ it.resizeY }}" title="Arrastra para cambiar la altura" style="{{ it.hB }}"></div>
              <div onPointerDown="{{ it.resizeX }}" title="Arrastra para cambiar el ancho" style="{{ it.hL }}"></div>
              <div onPointerDown="{{ it.resizeX }}" title="Arrastra para cambiar el ancho" style="{{ it.hR }}"></div>
              <div onPointerDown="{{ it.stop }}" style="position:absolute; bottom:100%; left:50%; transform:translate(-50%,-8px); display:flex; alignItems:center; gap:4px; padding:4px; borderRadius:9px; background:rgba(11,13,16,0.92); border:1px solid #2c323b; boxShadow:0 6px 16px rgba(0,0,0,0.45); zIndex:9">
                <button onClick="{{ it.smaller }}" title="Reducir" style="width:22px; height:22px; borderRadius:6px; border:none; background:#1c2027; color:#e7ebf1; fontSize:14px; fontWeight:900; lineHeight:1; cursor:pointer" style-hover="background:#2c323b">−</button>
                <span style="minWidth:34px; textAlign:center; fontSize:9px; fontWeight:800; letterSpacing:0.06em; color:#9aa4b2">{{ it.scaleLabel }}</span>
                <button onClick="{{ it.bigger }}" title="Aumentar" style="width:22px; height:22px; borderRadius:6px; border:none; background:#1c2027; color:#e7ebf1; fontSize:14px; fontWeight:900; lineHeight:1; cursor:pointer" style-hover="background:#2c323b">+</button>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ff2d4d&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#ff2d4d&quot;,&quot;#2563eb&quot;,&quot;#f59e0b&quot;,&quot;#22c55e&quot;],&quot;section&quot;:&quot;Marca&quot;},&quot;stripes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Campo&quot;}}">
const PC = ['#ef4444','#f97316','#f59e0b','#eab308','#84cc16','#22c55e','#2dd4bf','#38bdf8','#60a5fa','#a78bfa','#111827'];
const MAT = [
  { k: 'ball', label: 'BALÓN' }, { k: 'ladder', label: 'ESCALERA' },
  { k: 'hurdle', label: 'VALLA' }, { k: 'goal', label: 'PORTERÍA' },
  { k: 'zone', label: 'ZONA' }, { k: 'pole', label: 'PICA' }
];
const SIZES = {
  player: [3.8, 3.8], cone: [3.2, 3.2], flat: [3, 1.2], ball: [2.3, 2.3],
  ladder: [13, 4.4], hurdle: [5, 3], goal: [11, 3.4], zone: [15, 11], pole: [1.3, 6]
};
const PITCHES = {
  total: { label: 'CAMPO TOTAL', box: '0 0 1050 680', ratio: 1050 / 680 },
  ataque: { label: 'ATAQUE', box: '0 0 680 525', ratio: 680 / 525 },
  defensa: { label: 'DEFENSA', box: '0 0 680 525', ratio: 680 / 525 },
  libre: { label: 'LIBRE', box: '0 0 1000 660', ratio: 1000 / 660 }
};

class Component extends DCLogic {
  state = {
    title: 'Nuevo ejercicio táctico',
    pitch: 'total',
    theme: 'cesped',
    dorsales: true,
    tool: { kind: 'player', num: 1 },
    frames: [{ items: [], arrows: [] }],
    cf: 0,
    speed: '1000',
    playing: false,
    anim: null,
    draft: null,
    sel: null
  };

  fieldRef = React.createRef();
  history = [];

  cur() { return this.state.frames[this.state.cf]; }
  view() { return this.state.playing && this.state.anim ? this.state.anim : this.cur(); }

  push() {
    this.history.push(JSON.stringify(this.state.frames));
    if (this.history.length > 40) this.history.shift();
  }

  mutate(fn) {
    this.push();
    this.setState(s => {
      const frames = s.frames.map((f, i) => i === s.cf ? { items: f.items.slice(), arrows: f.arrows.slice() } : f);
      fn(frames[s.cf]);
      return { frames };
    });
  }

  pct(e) {
    const r = this.fieldRef.current.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(100, ((e.clientX - r.left) / r.width) * 100)),
      y: Math.max(0, Math.min(100, ((e.clientY - r.top) / r.height) * 100))
    };
  }

  componentDidMount() {
    this.mv = e => {
      if (this.rz) {
        const z = this.rz;
        const r = this.fieldRef.current.getBoundingClientRect();
        const cx = r.left + (z.x / 100) * r.width;
        const cy = r.top + (z.y / 100) * r.height;
        const cl = n => Math.max(0.35, Math.min(4, n));
        let patch;
        if (z.axis === 'x') patch = { sx: cl(z.s0x * (Math.abs(e.clientX - cx) / z.d0)) };
        else if (z.axis === 'y') patch = { sy: cl(z.s0y * (Math.abs(e.clientY - cy) / z.d0)) };
        else {
          const f2 = Math.hypot(e.clientX - cx, e.clientY - cy) / z.d0;
          patch = { sx: cl(z.s0x * f2), sy: cl(z.s0y * f2) };
        }
        this.mutate(f => {
          const i = f.items.findIndex(x => x.id === z.id);
          if (i >= 0) f.items[i] = Object.assign({}, f.items[i], patch);
        });
        this.history.pop();
      } else if (this.drag) {
        const p = this.pct(e);
        this.mutate(f => {
          const i = f.items.findIndex(x => x.id === this.drag);
          if (i >= 0) f.items[i] = Object.assign({}, f.items[i], p);
        });
        this.history.pop();
      } else if (this.state.draft) {
        const p = this.pct(e);
        this.setState(s => ({ draft: Object.assign({}, s.draft, { x2: p.x, y2: p.y }) }));
      }
    };
    this.up = () => {
      if (this.rz) { this.rz = null; return; }
      if (this.drag) { this.drag = null; return; }
      const d = this.state.draft;
      if (d) {
        this.setState({ draft: null });
        if (Math.hypot(d.x2 - d.x1, d.y2 - d.y1) > 2) this.mutate(f => f.arrows.push(Object.assign({ id: 'a' + Date.now() }, d)));
      }
    };
    this.kd = e => {
      if (!this.state.sel) return;
      if (e.key === '+' || e.key === '=') { this.scale(this.state.sel, 1.15); e.preventDefault(); }
      else if (e.key === '-' || e.key === '_') { this.scale(this.state.sel, 1 / 1.15); e.preventDefault(); }
      else if (e.key === 'Delete' || e.key === 'Backspace') {
        const id = this.state.sel;
        if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
        this.mutate(f => { f.items = f.items.filter(x => x.id !== id); });
        this.setState({ sel: null });
      } else if (e.key === 'Escape') this.setState({ sel: null });
    };
    window.addEventListener('pointermove', this.mv);
    window.addEventListener('pointerup', this.up);
    window.addEventListener('keydown', this.kd);
  }
  beginResize(e, it, axis, kx, ky) {
    e.stopPropagation();
    const r = this.fieldRef.current.getBoundingClientRect();
    const cx = r.left + (it.x / 100) * r.width, cy = r.top + (it.y / 100) * r.height;
    const d0 = axis === 'x' ? Math.abs(e.clientX - cx)
      : axis === 'y' ? Math.abs(e.clientY - cy)
      : Math.hypot(e.clientX - cx, e.clientY - cy);
    this.push();
    this.rz = { id: it.id, x: it.x, y: it.y, axis: axis, s0x: kx, s0y: ky, d0: Math.max(5, d0) };
  }
  scale(id, k) {
    const cl = n => Math.max(0.35, Math.min(4, n));
    this.mutate(f => {
      const i = f.items.findIndex(x => x.id === id);
      if (i < 0) return;
      const it = f.items[i];
      f.items[i] = Object.assign({}, it, { sx: cl((it.sx || 1) * k), sy: cl((it.sy || 1) * k) });
    });
  }
  componentWillUnmount() {
    window.removeEventListener('pointermove', this.mv);
    window.removeEventListener('pointerup', this.up);
    window.removeEventListener('keydown', this.kd);
    cancelAnimationFrame(this.raf);
  }

  onDown = e => {
    if (this.state.playing) return;
    const t = this.state.tool;
    const p = this.pct(e);
    if (this.state.sel) this.setState({ sel: null });
    if (!t) return;
    if (t.kind === 'stroke') { this.setState({ draft: { kind: t.line, color: '#fff', x1: p.x, y1: p.y, x2: p.x, y2: p.y } }); return; }
    if (t.kind === 'player') {
      if (this.cur().items.some(i => i.kind === 'player' && i.num === t.num)) return;
      this.mutate(f => f.items.push({ id: 'p' + t.num, kind: 'player', num: t.num, x: p.x, y: p.y }));
      return;
    }
    this.mutate(f => f.items.push(Object.assign({ id: t.kind + Date.now(), x: p.x, y: p.y }, t)));
  };

  noMenu = e => e.preventDefault();

  arrowD(a) {
    const x1 = a.x1 * 10, y1 = a.y1 * 10, x2 = a.x2 * 10, y2 = a.y2 * 10;
    if (a.kind !== 'dribble') return 'M' + x1 + ',' + y1 + ' L' + x2 + ',' + y2;
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len, amp = 16;
    const segs = Math.max(3, Math.round(len / 55));
    let d = 'M' + x1 + ',' + y1;
    for (let i = 1; i <= segs; i++) {
      const t = i / segs, m = (i - 0.5) / segs, s = i % 2 ? 1 : -1;
      d += ' Q' + (x1 + dx * m + nx * amp * s) + ',' + (y1 + dy * m + ny * amp * s) + ' ' + (x1 + dx * t) + ',' + (y1 + dy * t);
    }
    return d;
  }

  togglePlay = () => {
    if (this.state.playing) { cancelAnimationFrame(this.raf); this.setState({ playing: false, anim: null }); return; }
    const fr = this.state.frames;
    if (fr.length < 2) return;
    const dur = Number(this.state.speed);
    const t0 = performance.now();
    this.setState({ playing: true, anim: fr[0] });
    const loop = () => {
      const el = performance.now() - t0;
      const total = dur * (fr.length - 1);
      if (el >= total) { this.setState({ playing: false, anim: null }); return; }
      const seg = Math.floor(el / dur);
      const raw = (el % dur) / dur;
      const t = raw < 0.5 ? 2 * raw * raw : 1 - Math.pow(-2 * raw + 2, 2) / 2;
      const A = fr[seg], B = fr[seg + 1];
      const items = A.items.map(a => {
        const b = B.items.find(x => x.id === a.id);
        return b ? Object.assign({}, a, { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }) : a;
      });
      this.setState({ anim: { items, arrows: B.arrows } });
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  };

  renderVals() {
    const st = this.state;
    const v = this.view();
    const P = PITCHES[st.pitch];
    const accent = this.props.accent || '#ff2d4d';
    const tool = st.tool;
    const theme = st.theme;
    const athletic = theme === 'athletic';
    const stripes = this.props.stripes !== false;

    const btn = (on, extra) => 'display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:12px; font-size:11px; font-weight:800; letter-spacing:0.14em; cursor:pointer; text-align:left; ' +
      (on ? 'background:' + accent + '; color:#fff; border:2px solid #fff; box-shadow:0 4px 14px rgba(255,45,77,0.35);'
          : 'background:#14171c; color:#e7ebf1; border:1px solid #23262d;') + (extra || '');

    const pIcon = k => {
      const c = st.pitch === k ? '#fff' : accent;
      const paths = { total: 'M4 20L20 4M4 14v6h6M20 10V4h-6', ataque: 'M6 15l6-6 6 6', defensa: 'M6 9l6 6 6-6', libre: 'M6 6h12v12H6z' };
      return React.createElement('svg', { width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none', stroke: c, strokeWidth: 2.6, strokeLinecap: 'round' },
        React.createElement('path', { d: paths[k] }));
    };

    const pitches = Object.keys(PITCHES).map(k => ({
      label: PITCHES[k].label, icon: pIcon(k), style: btn(st.pitch === k),
      pick: () => this.setState({ pitch: k })
    }));

    const kitBg = n => !athletic ? PC[n - 1]
      : n === 11 ? '#facc15'
      : 'repeating-linear-gradient(90deg,#e30613 0 24%,#f4f4f4 24% 48%)';
    const kitText = n => !athletic ? '#fff' : n === 11 ? '#1f2937' : '#0f172a';
    const kitShadow = n => athletic && n !== 11 ? '0 1px 0 rgba(255,255,255,0.75)' : 'none';
    const kitBorder = n => athletic && n !== 11 ? '#7f1d1d' : 'rgba(255,255,255,0.75)';

    const used = n => this.cur().items.some(i => i.kind === 'player' && i.num === n);
    const players = PC.map((c, i) => {
      const n = i + 1, on = tool && tool.kind === 'player' && tool.num === n, u = used(n);
      return {
        num: n, title: u ? 'Jugador ' + n + ' (en campo)' : 'Colocar jugador ' + n,
        pick: () => this.setState({ tool: { kind: 'player', num: n } }),
        style: 'width:100%; aspect-ratio:1; border-radius:50%; background:' + kitBg(n) + '; color:' + kitText(n) + '; text-shadow:' + kitShadow(n) + '; font-size:13px; font-weight:900; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:' + (u ? 0.3 : 1) + '; border:' + (on ? '3px solid #0b0d10' : '2px solid ' + kitBorder(n)) + '; box-shadow:0 2px 6px rgba(15,23,42,0.25)'
      };
    });

    const coneDefs = [
      { kind: 'cone', color: '#ef4444', title: 'Cono rojo' },
      { kind: 'cone', color: '#3b82f6', title: 'Cono azul' },
      { kind: 'cone', color: '#22c55e', title: 'Cono verde' },
      { kind: 'flat', color: '#e5e7eb', title: 'Seta plana' }
    ];
    const cones = coneDefs.map(c => {
      const on = tool && tool.kind === c.kind && tool.color === c.color;
      return {
        color: c.color, title: c.title, isCone: c.kind === 'cone', isFlat: c.kind === 'flat',
        pick: () => this.setState({ tool: { kind: c.kind, color: c.color } }),
        style: 'display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:10px 4px 8px; border-radius:12px; cursor:pointer; background:#2b3037; border:' + (on ? '2px solid ' + accent : '1px solid #3a4149')
      };
    });

    const matIcon = k => {
      const c = tool && tool.kind === k ? '#fff' : accent;
      const g = {
        ball: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7l3.5 2.5-1.3 4h-4.4l-1.3-4z',
        ladder: 'M4 6h16v12H4zM4 10h16M4 14h16',
        hurdle: 'M9 20V6h6v14M7 6h10',
        goal: 'M4 18V7h16v11M8 7v11M12 7v11M16 7v11',
        zone: 'M5 5h14v14H5z',
        pole: 'M12 4v16M8 20h8'
      };
      return React.createElement('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: c, strokeWidth: 2, strokeLinecap: 'round' },
        React.createElement('path', { d: g[k] }));
    };
    const material = MAT.map(m => ({
      label: m.label, icon: matIcon(m.k),
      pick: () => this.setState({ tool: { kind: m.k } }),
      style: 'display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 8px; border-radius:12px; cursor:pointer; color:#e7ebf1; background:#14171c; border:' + (tool && tool.kind === m.k ? '2px solid ' + accent : '1px solid #23262d')
    }));

    const strokeDefs = [
      { line: 'run', label: 'CARRERA', dash: '5 5', preview: 'M3 6h34' },
      { line: 'pass', label: 'PASE', dash: '', preview: 'M3 6h34' },
      { line: 'dribble', label: 'CONDUCCIÓN', dash: '', preview: 'M3 6q5 -5 9 0t9 0t9 0t7 0' }
    ];
    const strokes = strokeDefs.map(s => ({
      label: s.label, dash: s.dash, preview: s.preview,
      pick: () => this.setState({ tool: { kind: 'stroke', line: s.line } }),
      style: btn(tool && tool.kind === 'stroke' && tool.line === s.line)
    }));

    const themeDefs = [
      { k: 'cesped', label: 'COLORES', sw: 'conic-gradient(#ef4444,#f59e0b,#22c55e,#38bdf8,#a78bfa,#ef4444)' },
      { k: 'athletic', label: 'ROJIBLANCO', sw: 'repeating-linear-gradient(90deg,#e30613 0 4px,#f4f4f4 4px 8px)' }
    ];
    const themes = themeDefs.map(t => ({
      label: t.label,
      pick: () => this.setState({ theme: t.k }),
      swatch: { width: 18, height: 18, borderRadius: 5, background: t.sw, border: '1px solid rgba(0,0,0,0.35)', flexShrink: 0, display: 'block' },
      style: btn(theme === t.k, ' justify-content:flex-start; letter-spacing:0.1em; padding:12px 12px;')
    }));

    const hBase = { position: 'absolute', background: '#fff', border: '2px solid ' + accent, boxShadow: '0 1px 4px rgba(0,0,0,0.5)', touchAction: 'none', zIndex: 10 };
    const handle = (sx, sy) => Object.assign({}, hBase, {
      width: 11, height: 11, borderRadius: 3,
      left: sx < 0 ? -6 : undefined, right: sx > 0 ? -6 : undefined,
      top: sy < 0 ? -6 : undefined, bottom: sy > 0 ? -6 : undefined,
      cursor: sx === sy ? 'nwse-resize' : 'nesw-resize'
    });
    const edge = side => {
      const horiz = side === 'l' || side === 'r';
      return Object.assign({}, hBase, {
        width: horiz ? 7 : 16, height: horiz ? 16 : 7, borderRadius: 4,
        left: side === 'l' ? -5 : (horiz ? undefined : '50%'),
        right: side === 'r' ? -5 : undefined,
        top: side === 't' ? -5 : (horiz ? '50%' : undefined),
        bottom: side === 'b' ? -5 : undefined,
        transform: horiz ? 'translateY(-50%)' : 'translateX(-50%)',
        cursor: horiz ? 'ew-resize' : 'ns-resize'
      });
    };

    const items = v.items.map(it => {
      const base = SIZES[it.kind] || [3, 3];
      const kx = it.sx || it.scale || 1, ky = it.sy || it.scale || 1;
      const k = Math.min(kx, ky);
      const sz = [base[0] * kx, base[1] * ky];
      const dim = it.kind === 'zone' || it.kind === 'goal' || it.kind === 'ladder';
      const isSel = !st.playing && st.sel === it.id;
      return {
        isSel: isSel,
        scaleLabel: Math.round(kx * 100) === Math.round(ky * 100)
          ? Math.round(kx * 100) + '%'
          : Math.round(kx * 100) + '×' + Math.round(ky * 100) + '%',
        stop: e => e.stopPropagation(),
        smaller: e => { e.stopPropagation(); this.scale(it.id, 1 / 1.15); },
        bigger: e => { e.stopPropagation(); this.scale(it.id, 1.15); },
        startResize: e => this.beginResize(e, it, 'both', kx, ky),
        resizeX: e => this.beginResize(e, it, 'x', kx, ky),
        resizeY: e => this.beginResize(e, it, 'y', kx, ky),
        hTL: handle(-1, -1), hTR: handle(1, -1), hBL: handle(-1, 1), hBR: handle(1, 1),
        hT: edge('t'), hB: edge('b'), hL: edge('l'), hR: edge('r'),
        title: 'Clic para seleccionar y redimensionar · doble clic para eliminar',
        isPlayer: it.kind === 'player', isCone: it.kind === 'cone', isFlat: it.kind === 'flat',
        isBall: it.kind === 'ball', isLadder: it.kind === 'ladder', isHurdle: it.kind === 'hurdle',
        isGoal: it.kind === 'goal', isZone: it.kind === 'zone', isPole: it.kind === 'pole',
        label: st.dorsales && it.kind === 'player' ? String(it.num) : '',
        chip: { width: '100%', height: '100%', borderRadius: '50%', background: PC[(it.num || 1) - 1], color: '#fff', fontSize: (1.6 * k).toFixed(2) + 'cqw', fontWeight: 900, display: 'flex', alignItems: 'center', justifyContent: 'center', border: '0.22cqw solid rgba(255,255,255,0.9)', boxShadow: '0 0.25cqw 0.6cqw rgba(0,0,0,0.45)' },
        tri: { width: 0, height: 0, borderLeft: sz[0] / 2 + 'cqw solid transparent', borderRight: sz[0] / 2 + 'cqw solid transparent', borderBottom: sz[1] + 'cqw solid ' + (it.color || '#ef4444'), filter: 'drop-shadow(0 0.2cqw 0.3cqw rgba(0,0,0,0.5))' },
        flat: { width: '100%', height: '100%', borderRadius: '50%', background: it.color || '#e5e7eb', opacity: 0.9 },
        box: {
          position: 'absolute', left: it.x + '%', top: it.y + '%', width: sz[0] + 'cqw', height: sz[1] + 'cqw',
          transform: 'translate(-50%,-50%)', display: 'flex', alignItems: 'center', justifyContent: 'center',
          cursor: st.playing ? 'default' : 'grab', touchAction: 'none',
          zIndex: isSel ? 8 : (dim ? 2 : 4),
          outline: isSel ? '2px dashed rgba(255,255,255,0.9)' : 'none',
          outlineOffset: '3px', borderRadius: isSel ? '3px' : 0
        },
        grab: e => { if (st.playing) return; e.stopPropagation(); this.drag = it.id; this.setState({ sel: it.id }); },
        remove: e => { e.stopPropagation(); this.mutate(f => { f.items = f.items.filter(x => x.id !== it.id); }); }
      };
    });

    const arrows = v.arrows.map(a => ({
      d: this.arrowD(a),
      color: a.kind === 'pass' ? '#ffd166' : a.kind === 'dribble' ? '#7dd3fc' : '#ffffff',
      dash: a.kind === 'run' ? '18 14' : ''
    }));

    const frames = st.frames.map((f, i) => ({
      n: i + 1, title: 'Fase ' + (i + 1),
      pick: () => this.setState({ cf: i, playing: false, anim: null }),
      style: 'width:42px; height:42px; border-radius:10px; font-size:13px; font-weight:900; cursor:pointer; ' +
        (i === st.cf ? 'background:' + accent + '; color:#fff; border:none;' : 'background:#14171c; color:#9aa4b2; border:1px solid #23262d;')
    }));

    const toolName = !tool ? 'ninguna' : tool.kind === 'player' ? 'JUGADOR ' + tool.num
      : tool.kind === 'stroke' ? strokeDefs.find(s => s.line === tool.line).label
      : (MAT.find(m => m.k === tool.kind) || {}).label || (tool.kind === 'flat' ? 'SETA' : 'CONO');

    const lines = {
      total: 'M0,0 H1050 V680 H0 Z M525,0 V680 M0,138.4 H165 V541.6 H0 M0,248.4 H55 V431.6 H0 M1050,138.4 H885 V541.6 H1050 M1050,248.4 H995 V431.6 H1050 M-22,306 H0 M-22,306 V374 H0 M1072,306 H1050 M1072,306 V374 H1050 M433.5,340 A91.5,91.5 0 1 0 616.5,340 A91.5,91.5 0 1 0 433.5,340 M165,275.5 A91.5,91.5 0 0 0 165,404.5 M885,275.5 A91.5,91.5 0 0 1 885,404.5',
      half: 'M0,0 H680 V525 H0 Z M138.4,0 V165 H541.6 V0 M248.4,0 V55 H431.6 V0 M306,-22 H374 M306,-22 V0 M374,-22 V0 M275.5,165 A91.5,91.5 0 0 0 404.5,165 M248.5,525 A91.5,91.5 0 0 1 431.5,525'
    };

    return {
      title: st.title,
      setTitle: e => this.setState({ title: e.target.value }),
      counterLabel: v.items.length + ' ELEMENTOS · ' + st.frames.length + ' FASES',
      hint: st.playing ? 'REPRODUCIENDO…'
        : st.sel ? 'SELECCIONADO · ESQUINAS = ESCALAR, LADOS = ANCHO/ALTO · − / + O TECLAS + Y − · SUPR PARA BORRAR'
        : 'HERRAMIENTA: ' + toolName + ' · CLIC PARA COLOCAR, ARRASTRA PARA MOVER O SELECCIONAR, DOBLE CLIC PARA BORRAR',
      pitches, players, cones, material, strokes, items, arrows, frames,
      dorsalLabel: st.dorsales ? '# DORSALES ON' : '# DORSALES OFF',
      dorsalStyle: 'padding:9px 14px; border-radius:999px; font-size:9px; font-weight:800; letter-spacing:0.14em; cursor:pointer; border:1px solid ' + (st.dorsales ? 'rgba(255,45,77,0.35)' : '#cbd3e0') + '; background:' + (st.dorsales ? 'rgba(255,45,77,0.1)' : '#fff') + '; color:' + (st.dorsales ? accent : '#8b95a6'),
      toggleDorsales: () => this.setState({ dorsales: !st.dorsales }),
      speed: st.speed,
      setSpeed: e => this.setState({ speed: e.target.value }),
      playing: st.playing, notPlaying: !st.playing,
      togglePlay: this.togglePlay,
      playStyle: 'width:42px; height:42px; border-radius:10px; border:none; cursor:' + (st.frames.length < 2 ? 'not-allowed' : 'pointer') + '; display:flex; align-items:center; justify-content:center; background:' + (st.frames.length < 2 ? '#1d4a33' : '#22c55e'),
      addFrame: () => this.setState(s => {
        const c = s.frames[s.cf];
        const copy = { items: c.items.map(i => Object.assign({}, i)), arrows: [] };
        const frames = s.frames.slice(); frames.splice(s.cf + 1, 0, copy);
        return { frames, cf: s.cf + 1, playing: false, anim: null };
      }),
      delFrame: () => this.setState(s => s.frames.length < 2 ? { frames: [{ items: [], arrows: [] }], cf: 0 }
        : { frames: s.frames.filter((f, i) => i !== s.cf), cf: Math.max(0, s.cf - 1) }),
      clearAll: () => { this.push(); this.setState({ frames: [{ items: [], arrows: [] }], cf: 0, playing: false, anim: null }); },
      undo: () => { const h = this.history.pop(); if (h) this.setState(s => { const frames = JSON.parse(h); return { frames, cf: Math.min(s.cf, frames.length - 1) }; }); },
      exportPng: () => window.print(),
      fieldRef: this.fieldRef,
      onDown: this.onDown, noMenu: this.noMenu,
      themes: themes,
      lineColor: 'rgba(255,255,255,0.5)',
      fieldStyle: {
        position: 'relative', containerType: 'size', flex: 'none',
        width: 'min(100cqw, ' + (100 * P.ratio).toFixed(3) + 'cqh)',
        height: 'min(100cqh, ' + (100 / P.ratio).toFixed(3) + 'cqw)',
        borderRadius: 14,
        background: stripes
          ? 'repeating-linear-gradient(180deg, rgba(255,255,255,0.045) 0 5%, rgba(0,0,0,0.05) 5% 10%), linear-gradient(180deg,#357a3b,#245227)'
          : 'linear-gradient(180deg,#2f6b34,#245227)',
        boxShadow: 'inset 0 0 120px rgba(0,0,0,0.45), 0 20px 50px rgba(0,0,0,0.5)',
        cursor: tool && tool.kind === 'stroke' ? 'crosshair' : 'copy', touchAction: 'none', overflow: 'hidden'
      },
      showLines: st.pitch !== 'libre',
      pitchBox: P.box,
      pitchTransform: st.pitch === 'defensa' ? 'translate(0,525) scale(1,-1)' : 'translate(0,0)',
      pitchLines: st.pitch === 'total' ? lines.total : lines.half,
      spot1x: st.pitch === 'total' ? 110 : 340, spot1y: st.pitch === 'total' ? 340 : 110,
      spot2x: st.pitch === 'total' ? 940 : 340, spot2y: st.pitch === 'total' ? 340 : 110,
      hasDraft: !!st.draft, draftD: st.draft ? this.arrowD(st.draft) : ''
    };
  }
}

</script>
